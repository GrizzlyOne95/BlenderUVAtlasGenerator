name: Release UV Atlas Generator v1.2.0 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.2.0-once.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync addon version to v1.2.0
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('uv_atlas_generator/__init__.py')
          text = path.read_text(encoding='utf-8')
          old = '"version": (1, 1, 1)'
          new = '"version": (1, 2, 0)'
          if new not in text:
              if old not in text:
                  raise SystemExit('Could not locate expected bl_info version')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          grep -F '"version": (1, 2, 0)' uv_atlas_generator/__init__.py

      - name: Verify Python syntax
        run: python -m py_compile uv_atlas_generator/__init__.py

      - name: Commit source version bump
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add uv_atlas_generator/__init__.py
            git commit -m 'Bump UV Atlas Generator to v1.2.0'
            git push origin HEAD:main
          fi

      - name: Capture release commit
        id: release_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Blender add-on ZIP
        run: |
          zip -r uv_atlas_generator-v1.2.0.zip uv_atlas_generator/
          test "$(stat -c%s uv_atlas_generator-v1.2.0.zip)" -gt 5000
          unzip -l uv_atlas_generator-v1.2.0.zip | grep -F 'uv_atlas_generator/__init__.py'

      - name: Create v1.2.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          target_commitish: ${{ steps.release_head.outputs.sha }}
          name: Release v1.2.0
          body_path: docs/RELEASE_NOTES_v1.2.0.md
          files: uv_atlas_generator-v1.2.0.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
